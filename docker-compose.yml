services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: realestate
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - realestate-network

  app:
    build: .
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    networks:
      - realestate-network

  frontend:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "80:80"
    networks:
      - realestate-network


volumes:
  mysql_data:


networks:
  realestate-network:
    driver: bridge
